<svg width="800" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4facfe">
        <animate attributeName="stop-color" values="#4facfe;#00f2fe;#4facfe" dur="5s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#00f2fe">
        <animate attributeName="stop-color" values="#00f2fe;#4facfe;#00f2fe" dur="5s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
  </defs>
  <rect width="800" height="200" fill="url(#bg)" rx="15" ry="15" />
  <text x="400" y="100" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="white" text-anchor="middle" alignment-baseline="middle">
    Awesome Revenue Recognition
  </text>
  <text x="400" y="140" font-family="Arial, sans-serif" font-size="20" fill="white" text-anchor="middle" alignment-baseline="middle">
    A Curated List of SaaS Products &amp; Open-Source Projects
  </text>
</svg>
