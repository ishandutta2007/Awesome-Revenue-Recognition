<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Animated Gradient for Text -->
    <linearGradient id="text-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#60a5fa" />
      <animate attributeName="x1" dur="4s" repeatCount="indefinite" values="0%; 100%; 0%" />
      <animate attributeName="x2" dur="4s" repeatCount="indefinite" values="100%; 200%; 100%" />
    </linearGradient>

    <!-- Filter for glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg-gradient)" rx="20" ry="20"/>

  <!-- Animated Particles / Nodes -->
  <g opacity="0.6">
    <circle cx="150" cy="100" r="4" fill="#60a5fa">
      <animate attributeName="cy" values="100;80;100" dur="3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="1050" cy="300" r="6" fill="#a78bfa">
      <animate attributeName="cy" values="300;320;300" dur="4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.6;1;0.6" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle cx="200" cy="300" r="5" fill="#38bdf8">
      <animate attributeName="cy" values="300;280;300" dur="5s" repeatCount="indefinite" />
    </circle>
    <circle cx="950" cy="100" r="3" fill="#818cf8">
      <animate attributeName="cy" values="100;120;100" dur="2.5s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Title Text -->
  <text x="600" y="200" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="bold" font-size="64" text-anchor="middle" fill="url(#text-gradient)" filter="url(#glow)">
    Awesome Revenue Recognition
  </text>
  
  <!-- Subtitle Text -->
  <text x="600" y="260" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" text-anchor="middle" fill="#94a3b8">
    Top Platforms, Open-Source Tools &amp; Engines for ASC 606 / IFRS 15
  </text>
  
  <!-- Simple Animated Line -->
  <line x1="450" y1="300" x2="750" y2="300" stroke="#a78bfa" stroke-width="2" opacity="0.8">
    <animate attributeName="x1" values="450; 550; 450" dur="3s" repeatCount="indefinite" />
    <animate attributeName="x2" values="750; 650; 750" dur="3s" repeatCount="indefinite" />
  </line>
</svg>
